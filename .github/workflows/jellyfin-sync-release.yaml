name: Tested version release

on:
  push:
    branches: [main]
    paths:
      - 'internal/provider/supported_jellyfin_version.env'
      - 'internal/provider/supported_*_plugin_version.env'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Each release supports one Jellyfin release, so a new tested version
      # is a minor release.
      - name: Changelog and minor tag
        id: bump
        run: |
          set -euo pipefail
          JV="$(grep -oP '(?<=JELLYFIN_VERSION=)[0-9]+(\.[0-9]+)*' internal/provider/supported_jellyfin_version.env)"
          SV="$(grep -oP '(?<=SECURITY_PLUGIN_VERSION=)[0-9]+(\.[0-9]+)*' internal/provider/supported_security_plugin_version.env)"
          test -n "$JV" && test -n "$SV"
          LATEST="$(git tag -l 'v*' --sort=-version:refname | head -1)"
          BASE="${LATEST#v}"
          IFS=. read -r MA MI _ <<< "$BASE"
          NEXT="v${MA}.$((MI + 1)).0"
          scripts/release_changelog.sh "${NEXT#v}" "$(date +%F)" \
            "- Supports only Jellyfin ${JV}, with JellyfinSecurity plugin ${SV} (versions tested in CI). Use an earlier provider release for an earlier Jellyfin."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: support Jellyfin $JV / JellyfinSecurity $SV and release $NEXT"
          git tag "$NEXT"
          git push origin main "$NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
