name: Schema Change Check

# A gate that stays pending on unrelated PRs can never be a required check.
on:
  pull_request:

permissions:
  contents: read

jobs:
  schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract old and new plugin versions
        id: versions
        run: |
          # Digits and dots only: these outputs are expanded into later scripts,
          # and the new value comes from the pull request.
          OLD_VERSION=$(git show origin/${{ github.base_ref }}:internal/provider/supported_security_plugin_version.env | grep -oP '(?<=SECURITY_PLUGIN_VERSION=)[0-9]+(\.[0-9]+)*')
          NEW_VERSION=$(grep -oP '(?<=SECURITY_PLUGIN_VERSION=)[0-9]+(\.[0-9]+)*' internal/provider/supported_security_plugin_version.env)
          # The env file carries the four-segment version Jellyfin installs.
          # The fourth segment picks the server ABI build of one release
          # (2.6.3.0 for 10.11, 2.6.3.1 for 12.x); the tag is v2.6.3 for both.
          OLD_RELEASE=$(echo "$OLD_VERSION" | cut -d. -f1-3)
          NEW_RELEASE=$(echo "$NEW_VERSION" | cut -d. -f1-3)
          echo "old=${OLD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW_RELEASE}" >> "$GITHUB_OUTPUT"
          if [ "$OLD_RELEASE" = "$NEW_RELEASE" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Plugin release unchanged (${NEW_RELEASE}); nothing to compare."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PluginConfiguration.cs at both versions
        if: steps.versions.outputs.bumped == 'true'
        run: |
          curl -sSL --fail "https://raw.githubusercontent.com/ZL154/JellyfinSecurity/v${{ steps.versions.outputs.old }}/src/Jellyfin.Plugin.TwoFactorAuth/Configuration/PluginConfiguration.cs" -o /tmp/old_config.cs
          curl -sSL --fail "https://raw.githubusercontent.com/ZL154/JellyfinSecurity/v${{ steps.versions.outputs.new }}/src/Jellyfin.Plugin.TwoFactorAuth/Configuration/PluginConfiguration.cs" -o /tmp/new_config.cs
          curl -sSL --fail "https://raw.githubusercontent.com/ZL154/JellyfinSecurity/v${{ steps.versions.outputs.old }}/src/Jellyfin.Plugin.TwoFactorAuth/Models/OidcProvider.cs" -o /tmp/old_oidc.cs
          curl -sSL --fail "https://raw.githubusercontent.com/ZL154/JellyfinSecurity/v${{ steps.versions.outputs.new }}/src/Jellyfin.Plugin.TwoFactorAuth/Models/OidcProvider.cs" -o /tmp/new_oidc.cs

      - name: Compare property signatures
        id: diff
        if: steps.versions.outputs.bumped == 'true'
        run: |
          # Extract public property signatures (type + name) from each file
          extract_props() {
            grep -oP 'public\s+(?:virtual\s+)?(?:\w+(?:<[^>]+>)?(?:\[\])?\??)\s+\w+\s*\{\s*get;\s*set;' "$1" | \
              sed 's/public\s*//; s/\s*{\s*get;\s*set;.*//' | sort
          }
          extract_props /tmp/old_config.cs > /tmp/old_config_props.txt
          extract_props /tmp/new_config.cs > /tmp/new_config_props.txt
          extract_props /tmp/old_oidc.cs > /tmp/old_oidc_props.txt
          extract_props /tmp/new_oidc.cs > /tmp/new_oidc_props.txt

          CONFIG_DIFF=$(diff /tmp/old_config_props.txt /tmp/new_config_props.txt || true)
          OIDC_DIFF=$(diff /tmp/old_oidc_props.txt /tmp/new_oidc_props.txt || true)

          if [ -z "$CONFIG_DIFF" ] && [ -z "$OIDC_DIFF" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No schema changes detected."
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          echo "PluginConfiguration.cs changes:"
          echo '```diff'
          echo "$CONFIG_DIFF"
          echo '```'
          echo ""
          echo "OidcProvider.cs changes:"
          echo '```diff'
          echo "$OIDC_DIFF"
          echo '```'

          # A bump that arrives with its resource update is the fix, not the
          # drift; testdata/security_plugin_config_schema.golden and the unit
          # test reading it check the update against what the plugin serves.
          RESOURCE=internal/provider/jellyfin_security_plugin_configuration_resource.go
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "$RESOURCE"; then
            echo "::error::JellyfinSecurity plugin schema changed between ${{ steps.versions.outputs.old }} and ${{ steps.versions.outputs.new }}"
            echo "::error::The typed Terraform resource must be updated before this version can be merged."
            exit 1
          fi
          echo "::notice::JellyfinSecurity plugin schema changed between ${{ steps.versions.outputs.old }} and ${{ steps.versions.outputs.new }}; this PR also changes ${RESOURCE}. Check it mirrors the diff above."

      - name: Comment on PR if schema changed
        if: failure() && steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **JellyfinSecurity plugin schema changed** in this version bump. The typed Terraform resource in `internal/provider/jellyfin_security_plugin_configuration_resource.go` must be updated to match before merging. See the workflow output for the property diff.'
            })
